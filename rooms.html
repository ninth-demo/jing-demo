<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="author" content="Ninth 九號">
<meta name="copyright" content="© 2026 Ninth 九號. All rights reserved.">
<title>房間｜靚民宿（網站提案示範）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="rooms.html">
<header id="site-head"></header>
<main>
  <div class="page-head">
    <div class="wrap">
      <div><p class="no geo">ROOMS</p><h1>房間</h1><p>兩種房型，一共四間。每一間都有自己的陽台和車位。</p></div>
      <div class="mini-window" aria-hidden="true"><span></span><span></span></div>
    </div>
  </div>
  <section class="sec" style="padding-top:64px">
    <div class="wrap">
      <h2 class="h2" style="font-size:28px">兩種房型比一比</h2>
      <div style="overflow-x:auto"><table class="compare" id="compare"></table></div>
      <div id="details"></div>
    </div>
  </section>
</main>
<footer id="site-foot"></footer>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script src="assets/guard.js"></script>
<script>
(function () {
  var data = JG.Store.load(), R = data.rooms;
  function row(label, fn) { return "<tr><th>" + label + "</th>" + R.map(function (r) { return "<td>" + fn(r) + "</td>"; }).join("") + "</tr>"; }
  document.getElementById("compare").innerHTML = "<thead><tr><th></th>" + R.map(function (r) { return '<th><a href="#' + r.id + '">' + JG.esc(r.name) + "</a></th>"; }).join("") + "</tr></thead><tbody>" +
    row("房間數", function (r) { return "共 " + r.count + " 間"; }) +
    row("適合", function (r) { return r.guests + " 人"; }) +
    row("床", function (r) { return JG.esc(r.bed); }) +
    row("陽台", function (r) { return r.amenities.some(function (a) { return /陽台/.test(a); }) ? "有" : "—"; }) +
    row("車位", function () { return "每間一個專屬車位"; }) +
    row("平日（週日到週四晚）", function (r) { return "<b>" + JG.money(r.weekday) + "</b>"; }) +
    row("假日（週五、週六晚）", function (r) { return "<b>" + JG.money(r.weekend) + "</b>"; }) + "</tbody>";
  document.getElementById("details").innerHTML = R.map(function (r) {
    return '<article class="room-detail" id="' + r.id + '"><div class="frame">' + roomVisual(r) + "</div>" +
      '<div><p class="geo muted" style="letter-spacing:.3em;font-size:13px">' + r.guests + " GUESTS · " + r.count + ' ROOMS</p><h2>' + JG.esc(r.name) + "</h2>" +
      '<p style="margin-top:14px;font-size:17px">' + JG.esc(r.desc) + '</p><div class="chips">' + r.amenities.map(function (a) { return "<span>" + JG.esc(a) + "</span>"; }).join("") + "</div>" +
      '<p style="margin-top:28px;display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-dark" href="booking.html?room=' + r.id + '">訂這間</a><a class="btn btn-outline" href="stay.html">住宿須知</a></p></div></article>';
  }).join("");
  if (location.hash) { var t = document.querySelector(location.hash); if (t) setTimeout(function () { t.scrollIntoView(); }, 50); }
})();
</script>
</body>
</html>
