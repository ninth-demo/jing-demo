<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">

<title>公告｜靚民宿（網站提案示範）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="notices.html">
<header id="site-head"></header>
<main>
  <div class="page-head">
    <div class="wrap">
      <div><p class="no geo">NOTICE</p><h1>公告</h1><p>訂房方式、房價調整、連假資訊，都會公告在這裡。點標題就能展開。</p></div>
      <div class="mini-window" aria-hidden="true"><span></span><span></span></div>
    </div>
  </div>
  <section class="sec" style="padding-top:56px">
    <div class="wrap"><div class="board" id="board" style="margin-top:0"></div></div>
  </section>
</main>
<footer id="site-foot"></footer>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script src="assets/guard.js"></script>
<script>
(function () {
  var list = JG.sortedNotices(JG.Store.load()), want = location.hash.slice(1);
  document.getElementById("board").innerHTML = list.map(function (n, i) {
    return '<details id="' + n.id + '"' + ((want ? want === n.id : i === 0) ? " open" : "") + '><summary><time datetime="' + n.date + '">' + n.date.replace(/-/g, ".") + '</time><span class="t">' + (n.pinned ? '<span class="pin">置頂</span>' : "") + JG.esc(n.title) + '</span><span class="plus" aria-hidden="true"></span></summary><div class="body">' + JG.paras(n.body) + "</div></details>";
  }).join("") || '<p class="muted" style="padding:20px 0">目前沒有公告。</p>';
})();
</script>
</body>
</html>
